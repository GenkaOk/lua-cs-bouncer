name: smartcaptcha unit tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    name: "captcha.lua unit tests"
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Install lua
      run: |
        sudo apt-get update
        sudo apt-get install -y lua5.1

    # the test stubs ngx/resty.http/cjson, so no OpenResty or Test::Nginx is needed
    - name: Run unit tests
      run: lua5.1 tests/smartcaptcha_unit.lua
